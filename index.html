        <!-- PWA Meta Tags -->
        <meta name="theme-color" content="#ff444f" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Deriv Bot" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="msapplication-TileColor" content="#ff444f" />
        <meta name="msapplication-tap-highlight" content="no" />

        <!-- Apple Touch Icons -->
        <link rel="apple-touch-icon" href="/assets/icons/pwa/icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/pwa/icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/pwa/icon-192x192.png" />
        <meta name="title" content="Build a trading bot without coding | Deriv Bot." />
        <meta
            name="description"
            content="Import your current bot or learn how to create a trading bot from scratch with our detailed guides, FAQs, and tutorials. Start with a quick strategy!"
        />
        <meta property="og:title" content="Deriv Bot" />
        <meta
            property="og:description"
            content="Import your current bot or learn how to create a trading bot from scratch with our detailed guides, FAQs, and tutorials. Start with a quick strategy!"
        />
        <title>Build a trading bot without coding | Deriv Bot.</title>
        <style>
            :root {
                font-size: 62.5%;
            }
        </style>
    </head>

    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <!-- LiveChat script -->
        <script type="text/javascript" defer>
            window.__lc = window.__lc || {};
            window.__lc.license = 12049137;
            window.__lc.asyncInit = true;
            (function (n, t, c) {
                function i(n) {
                    return e._h ? e._h.apply(null, n) : e._q.push(n);
                }
                var e = {
                    _q: [],
                    _h: null,
                    _v: '2.0',
                    on: function () {
                        i(['on', c.call(arguments)]);
                    },
                    once: function () {
                        i(['once', c.call(arguments)]);
                    },
                    off: function () {
                        i(['off', c.call(arguments)]);
                    },
                    get: function () {
                        if (!e._h) throw new Error('[LiveChatWidget] You can’t use getters before load.');
                        return i(['get', c.call(arguments)]);
                    },
                    call: function () {
                        i(['call', c.call(arguments)]);
                    },
                    init: function () {
                        setTimeout(() => {
                            var n = t.createElement('script');
                            ((n.async = !0),
                                (n.type = 'text/javascript'),
                                (n.src = 'https://cdn.livechatinc.com/tracking.js'),
                                t.head.appendChild(n));
                        }, 3000);
                    },
                };
                (!n.__lc.asyncInit && e.init(), (n.LiveChatWidget = n.LiveChatWidget || e));
            })(window, document, [].slice);
        </script>
        <!-- End LiveChat script -->

        <!-- Skip Firebase TMB fetch in Replit dev environment -->
        <script>
            (function() {
                try {
                    // Pre-seed TMB flag so isTmbEnabled() resolves immediately without Firebase fetch
                    if (!localStorage.getItem('is_tmb_enabled')) {
                        localStorage.setItem('is_tmb_enabled', 'false');
                    }
                    // Pre-seed is_tmb_enabled on window so initializeHook skips getActiveSessions
                    window.is_tmb_enabled = false;
                } catch(e) {}
            })();
        </script>
        <!-- Debug error catcher -->
        <script>
            // Show a visible marker immediately so we know HTML executes
            var debugDiv = document.createElement('div');
            debugDiv.id = 'debug-marker';
            debugDiv.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;background:yellow;color:black;font-size:14px;padding:8px;font-family:monospace;max-width:100vw;overflow-wrap:break-word;';
            debugDiv.textContent = 'HTML loaded. Waiting for React...';
            document.body.appendChild(debugDiv);

            var errors = [];
            window.addEventListener('error', function(e) {
                console.error('[GLOBAL ERROR]', e.message, e.filename, e.lineno, e.error);
                errors.push('ERROR: ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno);
                debugDiv.style.background = 'red';
                debugDiv.style.color = 'white';
                debugDiv.innerHTML = errors.map(function(s){return '<div>'+s+'</div>'}).join('');
            });
            window.addEventListener('unhandledrejection', function(e) {
                console.error('[UNHANDLED REJECTION]', e.reason);
                var msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
                errors.push('REJECTION: ' + msg);
                debugDiv.style.background = 'orange';
                debugDiv.innerHTML = errors.map(function(s){return '<div>'+s+'</div>'}).join('');
            });

            // Check if React mounted after 3 seconds
            setTimeout(function() {
                var root = document.getElementById('root');
                if (!root || root.children.length === 0) {
                    debugDiv.style.background = 'red';
                    debugDiv.style.color = 'white';
                    debugDiv.textContent = 'React did NOT mount after 3s. Root is empty. Errors: ' + errors.join('; ');
                } else {
                    debugDiv.textContent = 'React mounted OK. Root children: ' + root.children.length;
                    debugDiv.style.background = 'lime';
                }
            }, 3000);
        </script>
        <!-- Browser Service Worker Prevention -->
        <script>
            // Check browser compatibility and prevent service worker issues
            const userAgent = navigator.userAgent.toLowerCase();
            const isFirefox = userAgent.includes('firefox');
            const isSafari = userAgent.includes('safari') && !userAgent.includes('chrome');
            const shouldSkipSW = isFirefox || isSafari;

            if (shouldSkipSW) {
                const browserName = isFirefox ? 'Firefox' : 'Safari';
                console.log(
                    `[HTML] ${browserName} detected - preventing service worker registration to avoid chunk loading issues`
                );

                // Cleanup any existing service workers
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker
                        .getRegistrations()
                        .then(registrations => {
                            registrations.forEach(registration => {
                                console.log(`[HTML] Unregistering existing SW for ${browserName}:`, registration.scope);
                                registration.unregister();
                            });
                        })
                        .catch(error => {
                            console.error('[HTML] Failed to cleanup service workers:', error);
                        });
                }
            }

            // Check online/offline status
            console.log('[HTML] Online status:', navigator.onLine);
            window.addEventListener('online', () => {
                console.log('[HTML] Back online');
            });
            window.addEventListener('offline', () => {
                console.log('[HTML] Gone offline');
            });

            // Listen for service worker messages if registered by PWA utils (non-problematic browsers only)
            if ('serviceWorker' in navigator && !shouldSkipSW) {
                navigator.serviceWorker.addEventListener('message', event => {
                    console.log('[HTML] Message from service worker:', event.data);
                });
            }
        </script>
    </body>
</html>
